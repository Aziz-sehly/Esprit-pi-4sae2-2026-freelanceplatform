<div
    [ngClass]="{'blank-page': router.url === '/authentication' || router.url === '/authentication/sign-up' || router.url === '/authentication/forgot-password' || router.url === '/authentication/reset-password' || router.url === '/authentication/lock-screen' || router.url === '/authentication/logout' || router.url === '/authentication/confirm-email' || router.url === '/coming-soon' || isFrontRoute()}"
    [class.card-borderd-theme]="themeService.isCardBorder()"
    [class.card-border-radius]="themeService.isCardBorderRadius()"
    [class.rtl-enabled]="themeService.isRTLEnabled()"
>

    <!-- Sidebar - Masquée pour les routes front-office -->
    <app-sidebar *ngIf="!isFrontRoute()" />

    <!-- Main Content -->
    <div
        class="main-content transition d-flex flex-column"
        [ngClass]="{'active': isSidebarToggled}"
        [class.right-sidebar]="themeService.isRightSidebar()"
        [class.hide-sidebar]="themeService.isHideSidebar()"
    >
        <!-- Header - Masqué pour les routes front-office -->
        <app-header *ngIf="!isFrontRoute()" />
        <router-outlet />
        <div class="flex-grow-1"></div>
        <!-- Footer - Masqué pour les routes front-office -->
        <app-footer *ngIf="!isFrontRoute()" />
    </div>

    <!-- Customizer Settings - Masqué pour les routes front-office -->
    <app-customizer-settings *ngIf="!isFrontRoute()" />
    
    
</div>
