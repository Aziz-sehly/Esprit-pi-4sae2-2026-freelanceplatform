# The name this service registers with in Eureka
# The Gateway uses this exact name to route /api/posts/** requests here
spring.application.name=forum-service

# Forum Service runs on port 8082
# Direct access: http://localhost:8082/api/posts
# Via Gateway:   http://localhost:8080/api/posts
server.port=8082

# ?? Database Connection ???????????????????????????????????????????????
# Same MySQL database as Reviews Service ("freelance")
# Both services share one database but use different tables
spring.datasource.url=jdbc:mysql://localhost:3306/freelance?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ?? Hibernate / JPA Settings ??????????????????????????????????????????
# update = automatically create/update tables based on entity classes
# Hibernate will create "forum_posts" and "replies" tables if they don't exist,
# and add new columns (like videoUrl) when you add fields to the entity class
spring.jpa.hibernate.ddl-auto=update

# Prints every SQL query to the console ? useful for debugging
spring.jpa.show-sql=true

# ?? Eureka Registration ???????????????????????????????????????????????
# Register this service with Eureka so the Gateway can find it
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# ?? File Upload Limits ????????????????????????????????????????????????
# Increased from the default 1MB to 50MB to support audio file uploads (MP3s)
# Without this, uploading an MP3 would fail with a "file too large" error
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# Serves static files from the uploads/ folder on disk
# This is what makes http://localhost:8082/uploads/filename.mp3 work
# Without this, Spring would not know where to find the uploaded files
spring.web.resources.static-locations=file:uploads/