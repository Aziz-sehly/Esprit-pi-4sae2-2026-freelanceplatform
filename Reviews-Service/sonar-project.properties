sonar.projectKey=reviews-service
sonar.projectName=Reviews-Service
sonar.projectVersion=0.0.1

# Where your source code is
sonar.sources=src/main/java
# Where your test code is
sonar.tests=src/test/java

# Java bindings (compiled classes — needed for accurate analysis)
sonar.java.binaries=target/classes

# Test coverage report (generated by mvn test)
sonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml

# Encoding
sonar.sourceEncoding=UTF-8
