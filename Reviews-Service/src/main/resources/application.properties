# The name this service registers itself with in Eureka
# The Gateway uses this name to route /api/reviews/** requests here
spring.application.name=reviews-service

# Reviews Service runs on port 8081
# Direct access: http://localhost:8081/api/reviews
# Via Gateway:   http://localhost:8080/api/reviews
server.port=8081

# ?? Database Connection ???????????????????????????????????????????????
# JDBC URL to connect to the MySQL database
# "freelance" is the database name
# createDatabaseIfNotExist=true means MySQL creates the "freelance" database
# automatically if it doesn't already exist
spring.datasource.url=jdbc:mysql://localhost:3306/freelance?createDatabaseIfNotExist=true

# MySQL username and password (root with no password ? common in local development)
spring.datasource.username=root
spring.datasource.password=

# The driver class that lets Java talk to MySQL
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ?? Hibernate / JPA Settings ??????????????????????????????????????????
# ddl-auto=update means Hibernate automatically:
#   - Creates tables if they don't exist
#   - Adds new columns if you add new fields to your entity classes
#   - NEVER deletes or renames columns (safe for development)
spring.jpa.hibernate.ddl-auto=update

# show-sql=true prints every SQL query Hibernate runs to the IntelliJ console
# Very useful for debugging ? you can see exactly what database queries are being made
spring.jpa.show-sql=true

# ?? Eureka Registration ???????????????????????????????????????????????
# Tell this service where to find the Eureka registry so it can register itself
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/