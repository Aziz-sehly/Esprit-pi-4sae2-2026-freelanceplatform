name: Backend CI

on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:

jobs:
  backend-modules:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module:
          - payment/payment
          - milestone/milestone

    defaults:
      run:
        working-directory: ${{ matrix.module }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build and test module
        run: ./mvnw package
