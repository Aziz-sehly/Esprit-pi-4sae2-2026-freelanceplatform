server:
  port: 8080

spring:
  codec:
    max-in-memory-size: 10MB
  application:
    name: api-gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: false
      routes:
        - id: message-service-route
          uri: lb://message-service
          predicates:
            - Path=/messages/**
          filters:
            - RewritePath=/messages(?<segment>.*), /api/messages${segment}

        - id: message-websocket-route
          uri: lb://message-service
          predicates:
            - Path=/ws/**

        - id: dispute-service-route
          uri: lb://dispute-service
          predicates:
            - Path=/disputes/**
          filters:
            - RewritePath=/disputes(?<segment>.*), /api/disputes${segment}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8180/realms/prolance
          jwk-set-uri: http://localhost:8180/realms/prolance/protocol/openid-connect/certs

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
