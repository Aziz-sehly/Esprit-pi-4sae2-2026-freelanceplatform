server:
  port: 8106

spring:
  application:
    name: media-analysis-service

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
  metrics:
    tags:
      application: ${spring.application.name}
  prometheus:
    metrics:
      export:
        enabled: true

app:
  media:
    # Taille max téléchargée depuis message-service (octets)
    max-download-bytes: 25165824
    # Pénalité si dépassement (score intrinsèque plafonné)
    oversized-penalty: 0.35
