# Optional local overrides (e.g. gemini.api.key) — file is gitignored
spring.config.import=optional:classpath:application-local.properties

spring.application.name=Microservice-proposal

#DB configuration
spring.datasource.url=jdbc:mysql://localhost:3306/prolance_proposal?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

#server configuration
server.port=8092

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# Google Gemini (AI cover letter). Prefer GEMINI_API_KEY env; see https://aistudio.google.com/apikey
gemini.api.key=${GEMINI_API_KEY:}
proposal.expiration.days=7
