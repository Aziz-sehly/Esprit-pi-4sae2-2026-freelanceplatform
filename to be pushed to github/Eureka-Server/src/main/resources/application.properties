# The name this service registers itself with in the Eureka registry
spring.application.name=eureka-server

# Eureka runs on port 8761 ? you can visit http://localhost:8761 in the browser
# to see a dashboard showing all registered microservices
server.port=8761

# These two lines tell Eureka: "don't register yourself with yourself"
# Eureka is the registry ? it doesn't need to register as a service
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false

# Don't wait before starting up ? start immediately even if no other services are connected yet
eureka.server.wait-time-in-ms-when-sync-empty=0