# The name this service registers itself with in Eureka
spring.application.name=gateway-service

# The Gateway listens on port 8080.
# The Angular frontend sends ALL its requests to http://localhost:8080
# and the Gateway decides which microservice to forward them to.
server.port=8080

# Tell the Gateway where to find the Eureka registry
# so it can look up the addresses of the other services
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# ?? ROUTE 1: Reviews Service ??????????????????????????????????????????
# If a request comes in with a URL starting with /api/reviews/...
# forward it to the Reviews Service (running on port 8081)
# "lb://" means "load balanced" ? use Eureka to find the service by name
spring.cloud.gateway.routes[0].id=reviews-service
spring.cloud.gateway.routes[0].uri=lb://reviews-service
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/reviews/**

# ?? ROUTE 2: Forum Service ????????????????????????????????????????????
# If a request comes in with a URL starting with /api/posts/... or /api/replies/...
# forward it to the Forum Service (running on port 8082)
spring.cloud.gateway.routes[1].id=forum-service
spring.cloud.gateway.routes[1].uri=lb://forum-service
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/posts/**,/api/replies/**