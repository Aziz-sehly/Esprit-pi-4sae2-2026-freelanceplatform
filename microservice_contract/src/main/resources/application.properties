# ?? Server ??????????????????????????????????????????????????????????????????
server.port=8083

# ?? Application name ????????????????????????????????????????????????????????
spring.application.name=microservice-contract

# ?? DataSource ???????????????????????????????????????????????????????????????
spring.datasource.url=jdbc:mysql://localhost:3306/prolance_contracts?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ?? JPA / Hibernate ???????????????????????????????????????????????????????????
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ?? Eureka Client ?????????????????????????????????????????????????????????????
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.fetch-registry=true
eureka.client.register-with-eureka=true
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${server.port}

# ?? Actuator ??????????????????????????????????????????????????????????????????
management.endpoints.web.exposure.include=health,info,metrics

# ?? Error Handling ????????????????????????????????????????????????????????????
spring.web.error.include-message=always
spring.web.error.include-binding-errors=always

