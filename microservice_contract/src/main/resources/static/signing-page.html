<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>ProLance — Sign Contract</title>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .card {
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 650px;
            overflow: hidden;
        }

        .header {
            background: #1a73e8;
            padding: 28px 32px;
            text-align: center;
        }

        .header h1 { color: #fff; margin: 0; }
        .header p { color: #c8d8f8; margin: 8px 0 0; }

        .body { padding: 32px; }

        .meta {
            background: #f0f4ff;
            border-radius: 8px;
            padding: 14px;
            margin-bottom: 20px;
        }

        .status-box {
            background: #fff3cd;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 20px;
            font-size: 14px;
            text-align: center;
        }

        /* Tab styles */
        .tabs {
            display: flex;
            margin-bottom: 20px;
            border-bottom: 2px solid #e0e0e0;
        }

        .tab-btn {
            flex: 1;
            padding: 12px;
            background: none;
            border: none;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            color: #666;
            transition: all 0.3s;
        }

        .tab-btn.active {
            color: #1a73e8;
            border-bottom: 2px solid #1a73e8;
            margin-bottom: -2px;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        /* Draw signature styles */
        .signature-area {
            border: 2px solid #ddd;
            border-radius: 8px;
            padding: 10px;
            margin-bottom: 15px;
        }

        canvas {
            border: 1px solid #ccc;
            width: 100%;
            height: 200px;
            cursor: crosshair;
            background: white;
        }

        /* Upload signature styles */
        .upload-area {
            border: 2px dashed #ddd;
            border-radius: 8px;
            padding: 40px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            margin-bottom: 15px;
        }

        .upload-area:hover {
            border-color: #1a73e8;
            background: #f8f9ff;
        }

        .upload-area.drag-over {
            border-color: #1a73e8;
            background: #e8f0fe;
        }

        .preview-image {
            max-width: 100%;
            max-height: 200px;
            margin-top: 15px;
            display: none;
        }

        .preview-image img {
            max-width: 100%;
            max-height: 200px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        button {
            flex: 1;
            padding: 12px;
            background: #1a73e8;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
        }

        button:hover:not(:disabled) {
            background: #1557b0;
        }

        button:disabled {
            background: #aaa;
            cursor: not-allowed;
        }

        .clear-btn {
            background: #6c757d;
        }

        .clear-btn:hover:not(:disabled) {
            background: #545b62;
        }

        .status {
            margin-top: 15px;
            padding: 12px;
            text-align: center;
            display: none;
            border-radius: 8px;
        }

        .success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .info {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }

        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #1a73e8;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 10px;
            vertical-align: middle;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .file-input {
            display: none;
        }
    </style>
</head>

<body>

<div class="card">
    <div class="header">
        <h1>ProLance</h1>
        <p>Contract Signing</p>
    </div>

    <div class="body">

        <div class="meta">
            <strong>Contract #<span id="contractIdDisplay"></span></strong><br>
            <strong>Role:</strong> <span id="roleDisplay"></span>
        </div>

        <div class="status-box" id="signatureStatus">
            Loading signature status...
        </div>

        <!-- Tabs -->
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('draw')">✍️ Draw Signature</button>
            <button class="tab-btn" onclick="switchTab('upload')">📤 Upload Image</button>
        </div>

        <!-- Draw Signature Tab -->
        <div id="drawTab" class="tab-content active">
            <div class="signature-area">
                <p><strong>Draw your signature:</strong></p>
                <canvas id="sigCanvas"></canvas>
            </div>
            <div class="button-group">
                <button class="clear-btn" onclick="clearCanvas()">Clear Canvas</button>
            </div>
        </div>

        <!-- Upload Image Tab -->
        <div id="uploadTab" class="tab-content">
            <div class="upload-area" id="uploadArea">
                <p>📁 Click or drag and drop your signature image here</p>
                <p style="font-size: 12px; color: #666; margin-top: 10px;">
                    Supported formats: PNG, JPG, JPEG, GIF
                </p>
                <input type="file" id="fileInput" class="file-input" accept="image/*" onchange="handleFileUpload(this)">
            </div>
            <div class="preview-image" id="previewImage">
                <img id="signaturePreview" alt="Signature preview">
                <button class="clear-btn" onclick="clearUploadedImage()" style="margin-top: 10px;">Remove Image</button>
            </div>
        </div>

        <!-- Submit Button -->
        <div class="button-group">
            <button id="submitBtn" onclick="submitSignature()">Sign Contract</button>
        </div>

        <div id="statusMsg" class="status"></div>

    </div>
</div>

<script>

    // Get parameters from URL
    const params = new URLSearchParams(window.location.search);
    const token = params.get('token');
    const contractId = params.get('contractId');
    const role = params.get('role');

    // Validate required parameters
    if (!token || !contractId || !role) {
        showStatus("Invalid signing link: missing required parameters", false);
        document.getElementById('submitBtn').disabled = true;
    } else {
        document.getElementById('contractIdDisplay').textContent = contractId;
        document.getElementById('roleDisplay').textContent = role;
    }

    // Variables for signature
    let currentSignatureData = null;
    let currentSignatureType = null; // 'draw' or 'upload'

    // Canvas setup
    const canvas = document.getElementById('sigCanvas');
    const ctx = canvas.getContext('2d');
    let drawing = false;
    let hasDrawn = false;

    // Set canvas size
    function resizeCanvas() {
        const rect = canvas.getBoundingClientRect();
        canvas.width = rect.width;
        canvas.height = 200;

        // Set default styling
        ctx.fillStyle = 'white';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.lineWidth = 2;
        ctx.strokeStyle = '#000';
    }

    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // Drawing functions
    function startDrawing(e) {
        drawing = true;
        const pos = getCanvasCoordinates(e);
        ctx.beginPath();
        ctx.moveTo(pos.x, pos.y);
        ctx.stroke();
    }

    function draw(e) {
        if (!drawing) return;
        e.preventDefault();
        const pos = getCanvasCoordinates(e);
        ctx.lineTo(pos.x, pos.y);
        ctx.stroke();
        hasDrawn = true;
    }

    function stopDrawing() {
        drawing = false;
    }

    function getCanvasCoordinates(e) {
        const rect = canvas.getBoundingClientRect();
        const scaleX = canvas.width / rect.width;
        const scaleY = canvas.height / rect.height;

        let clientX, clientY;

        if (e.touches) {
            clientX = e.touches[0].clientX;
            clientY = e.touches[0].clientY;
        } else {
            clientX = e.clientX;
            clientY = e.clientY;
        }

        let x = (clientX - rect.left) * scaleX;
        let y = (clientY - rect.top) * scaleY;

        x = Math.max(0, Math.min(canvas.width, x));
        y = Math.max(0, Math.min(canvas.height, y));

        return { x, y };
    }

    // Event listeners for drawing
    canvas.addEventListener('mousedown', startDrawing);
    canvas.addEventListener('mousemove', draw);
    canvas.addEventListener('mouseup', stopDrawing);
    canvas.addEventListener('mouseleave', stopDrawing);
    canvas.addEventListener('touchstart', startDrawing);
    canvas.addEventListener('touchmove', draw);
    canvas.addEventListener('touchend', stopDrawing);

    function clearCanvas() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = 'white';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        hasDrawn = false;
        currentSignatureData = null;
        currentSignatureType = null;
        showStatus("Canvas cleared", true);
    }

    // Tab switching
    function switchTab(tab) {
        // Update tab buttons
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        event.target.classList.add('active');

        // Update tab content
        document.getElementById('drawTab').classList.remove('active');
        document.getElementById('uploadTab').classList.remove('active');

        if (tab === 'draw') {
            document.getElementById('drawTab').classList.add('active');
            currentSignatureType = 'draw';
        } else {
            document.getElementById('uploadTab').classList.add('active');
            currentSignatureType = 'upload';
        }

        currentSignatureData = null;
    }

    // File upload handling
    function handleFileUpload(input) {
        const file = input.files[0];
        if (!file) return;

        if (!file.type.startsWith('image/')) {
            showStatus("Please upload an image file", false);
            return;
        }

        const reader = new FileReader();
        reader.onload = function(e) {
            const img = new Image();
            img.onload = function() {
                // Resize image if too large
                const maxWidth = 600;
                const maxHeight = 200;
                let width = img.width;
                let height = img.height;

                if (width > maxWidth) {
                    height = (height * maxWidth) / width;
                    width = maxWidth;
                }
                if (height > maxHeight) {
                    width = (width * maxHeight) / height;
                    height = maxHeight;
                }

                const canvas = document.createElement('canvas');
                canvas.width = width;
                canvas.height = height;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0, width, height);

                currentSignatureData = canvas.toDataURL('image/png');
                currentSignatureType = 'upload';

                // Show preview
                const preview = document.getElementById('signaturePreview');
                preview.src = currentSignatureData;
                document.getElementById('previewImage').style.display = 'block';
                document.getElementById('uploadArea').style.display = 'none';

                showStatus("Image uploaded successfully!", true);
            };
            img.src = e.target.result;
        };
        reader.readAsDataURL(file);
    }

    function clearUploadedImage() {
        currentSignatureData = null;
        currentSignatureType = null;
        document.getElementById('fileInput').value = '';
        document.getElementById('previewImage').style.display = 'none';
        document.getElementById('uploadArea').style.display = 'block';
        showStatus("Image removed", true);
    }

    // Drag and drop for upload area
    const uploadArea = document.getElementById('uploadArea');

    uploadArea.addEventListener('dragover', (e) => {
        e.preventDefault();
        uploadArea.classList.add('drag-over');
    });

    uploadArea.addEventListener('dragleave', () => {
        uploadArea.classList.remove('drag-over');
    });

    uploadArea.addEventListener('drop', (e) => {
        e.preventDefault();
        uploadArea.classList.remove('drag-over');
        const file = e.dataTransfer.files[0];
        if (file && file.type.startsWith('image/')) {
            const input = document.getElementById('fileInput');
            input.files = e.dataTransfer.files;
            handleFileUpload(input);
        } else {
            showStatus("Please drop an image file", false);
        }
    });

    uploadArea.addEventListener('click', () => {
        document.getElementById('fileInput').click();
    });

    // Check signature status
    async function checkStatus() {
        if (!contractId) return;

        try {
            const response = await fetch(`/api/contracts/${contractId}/signatures/status`);

            if (!response.ok) {
                throw new Error(`HTTP ${response.status}`);
            }

            const data = await response.json();
            const statusBox = document.getElementById('signatureStatus');

            if (data.fullySigned) {
                statusBox.innerHTML = "✅ Both parties have signed. Contract is ACTIVE!";
                statusBox.style.background = "#d4edda";
                statusBox.style.color = "#155724";
                document.getElementById('submitBtn').disabled = true;
            } else if (data.yourStatus === 'SIGNED') {
                statusBox.innerHTML = "✅ You have already signed this contract. Waiting for the other party...";
                statusBox.style.background = "#d4edda";
                statusBox.style.color = "#155724";
                document.getElementById('submitBtn').disabled = true;
            } else {
                statusBox.innerHTML = "⏳ Waiting for signatures...";
                statusBox.style.background = "#fff3cd";
                statusBox.style.color = "#856404";
                document.getElementById('submitBtn').disabled = false;
            }

        } catch (error) {
            console.error('Error checking status:', error);
            document.getElementById('signatureStatus').innerHTML =
                "⚠️ Cannot check signature status. Please refresh the page.";
            document.getElementById('signatureStatus').style.background = "#f8d7da";
            document.getElementById('signatureStatus').style.color = "#721c24";
        }
    }

    // Submit signature
    async function submitSignature() {
        let signatureData = null;

        // Get signature data based on current tab
        if (currentSignatureType === 'draw') {
            if (!hasDrawn) {
                showStatus("Please draw your signature first", false);
                return;
            }
            signatureData = canvas.toDataURL('image/png');
        } else if (currentSignatureType === 'upload') {
            if (!currentSignatureData) {
                showStatus("Please upload a signature image first", false);
                return;
            }
            signatureData = currentSignatureData;
        } else {
            showStatus("Please choose a signature method (draw or upload)", false);
            return;
        }

        const submitBtn = document.getElementById('submitBtn');
        submitBtn.disabled = true;
        submitBtn.innerHTML = '<span class="loading"></span> Submitting...';

        try {
            const response = await fetch(`/api/contracts/${contractId}/signatures/sign`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    token: token,
                    signatureData: signatureData,
                    ipAddress: await getClientIP()
                })
            });

            if (response.ok) {
                const result = await response.json();
                showStatus("✓ Signature submitted successfully! Contract has been signed.", true);
                document.getElementById('submitBtn').disabled = true;
                submitBtn.innerHTML = '✓ Signed';
                checkStatus(); // Refresh status
            } else {
                const error = await response.text();
                showStatus("Error: " + error, false);
                submitBtn.disabled = false;
                submitBtn.innerHTML = 'Sign Contract';
            }
        } catch (error) {
            console.error('Submit error:', error);
            showStatus("Network error: " + error.message, false);
            submitBtn.disabled = false;
            submitBtn.innerHTML = 'Sign Contract';
        }
    }

    // Get client IP (optional)
    async function getClientIP() {
        try {
            const response = await fetch('https://api.ipify.org?format=json');
            const data = await response.json();
            return data.ip;
        } catch (error) {
            return 'unknown';
        }
    }

    function showStatus(msg, success) {
        const el = document.getElementById('statusMsg');
        el.innerText = msg;
        el.className = "status " + (success ? "success" : "error");
        el.style.display = "block";

        setTimeout(() => {
            if (el.style.display === "block") {
                el.style.display = "none";
            }
        }, 5000);
    }

    // Initialize
    currentSignatureType = 'draw';
    checkStatus();
    setInterval(checkStatus, 5000);

</script>

</body>
</html>
