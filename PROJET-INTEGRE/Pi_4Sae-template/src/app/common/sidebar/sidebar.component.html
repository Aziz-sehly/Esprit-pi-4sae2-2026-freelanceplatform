<div
    class="sidebar-area bg-white"
    [ngClass]="{'active': isSidebarToggled}"
    [class.component-dark-theme]="themeService.isDark()"
    [class.dark-sidebar]="themeService.isSidebarDark()"
    [class.right-sidebar]="themeService.isRightSidebar()"
    [class.hide-sidebar]="themeService.isHideSidebar()"
    [class.card-borderd-theme]="themeService.isCardBorder()"
    [class.rtl-enabled]="themeService.isRTLEnabled()"
>
    <div class="logo bg-white">
        <a routerLink="/back" class="d-flex align-items-center">
            <img src="images/logo-icon.svg" alt="logo-icon">
            <span class="fw-semibold">Daxa</span>
        </a>
    </div>
    <div
        (click)="toggle()"
        class="burger-menu"
        [ngClass]="{'active': isSidebarToggled}"
    >
        <span class="top-bar"></span>
        <span class="middle-bar"></span>
        <span class="bottom-bar"></span>
    </div>

    <ng-scrollbar visibility="hover">
        <div class="sidebar-inner">
            <div class="sidebar-menu">
                <mat-accordion>
                    <span class="sub-title text-body">
                        ADMIN - COMMUNICATION
                    </span>

                    <a
                        routerLink="/back/admin-messages"
                        class="sidebar-menu-link"
                        routerLinkActive="active"
                        [routerLinkActiveOptions]="{exact: true}"
                    >
                        <i class="material-symbols-outlined">mail</i>
                        <span class="title">Messages</span>
                    </a>

                    <a
                        routerLink="/back/admin-disputes"
                        class="sidebar-menu-link"
                        routerLinkActive="active"
                    >
                        <i class="material-symbols-outlined">gavel</i>
                        <span class="title">Disputes</span>
                    </a>

                    <a
                        routerLink="/back/admin-users"
                        class="sidebar-menu-link"
                        routerLinkActive="active"
                    >
                        <i class="material-symbols-outlined">group</i>
                        <span class="title">User management</span>
                    </a>

                    <span class="sub-title text-body">
                        ADMIN - COMMUNITY
                    </span>

                    <a
                        routerLink="/back/admin-reviews"
                        class="sidebar-menu-link"
                        routerLinkActive="active"
                    >
                        <i class="material-symbols-outlined">star</i>
                        <span class="title">Reviews</span>
                    </a>

                    <a
                        routerLink="/back/admin-forum"
                        class="sidebar-menu-link"
                        routerLinkActive="active"
                    >
                        <i class="material-symbols-outlined">forum</i>
                        <span class="title">Forum</span>
                    </a>

                    <span class="sub-title text-body">
                        NAVIGATION
                    </span>
                    <a routerLink="/front" class="sidebar-menu-link" routerLinkActive="active">
                        <i class="material-symbols-outlined">open_in_new</i>
                        <span class="title">View site</span>
                    </a>
                </mat-accordion>
            </div>
        </div>
    </ng-scrollbar>
</div>
