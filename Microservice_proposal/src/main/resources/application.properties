spring.application.name=Microservice_proposal

#DB configuration
spring.datasource.url=jdbc:mysql://localhost:3306/freelance1
spring.datasource.username=root
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

#server configuration
server.port=8092
server.servlet.context-path=/freelance1

ureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true