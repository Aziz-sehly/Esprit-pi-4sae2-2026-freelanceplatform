spring.application.name=gateway
server.port=8085

# Eureka config
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# Enable Gateway auto-routing
spring.cloud.gateway.discovery.locator.enabled=true
spring.cloud.gateway.discovery.locator.lower-case-service-id=true

# FIXED CORS Configuration - Use comma-separated values instead of array notation
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-origins=http://localhost:4200
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-methods=GET,POST,PUT,DELETE,OPTIONS,PATCH
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-headers=Authorization,Content-Type,Accept,X-Requested-With,Origin,Cache-Control
spring.cloud.gateway.globalcors.cors-configurations.[/**].allow-credentials=true
spring.cloud.gateway.globalcors.cors-configurations.[/**].max-age=3600

# Remove this line - it can cause issues with Spring Boot 3
# spring.cloud.gateway.globalcors.add-to-simple-url-handler-mapping=false

# Actuator
management.endpoints.web.exposure.include=health,info,gateway
management.endpoint.gateway.enabled=true

# Disable security for testing (temporarily)


# Logging
logging.level.org.springframework.cloud.gateway.handler.RoutePredicateHandlerMapping=INFO
logging.level.org.springframework.cloud.gateway=TRACE