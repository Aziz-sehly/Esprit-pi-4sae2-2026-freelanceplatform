apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: pidev-services
  namespace: monitoring
  labels:
    release: kube-prometheus
spec:
  namespaceSelector:
    matchNames:
      - pidev
  selector:
    matchLabels: {}
  endpoints:
    - path: /actuator/prometheus
      interval: 15s
      port: http
      relabelings:
        - sourceLabels: [__meta_kubernetes_service_name]
          targetLabel: service
        - sourceLabels: [__meta_kubernetes_pod_name]
          targetLabel: pod
