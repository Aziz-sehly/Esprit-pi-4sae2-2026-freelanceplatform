# Single MySQL pod (StatefulSet) used by message-service & dispute-service in dev.
# In production prefer a managed DB (RDS / CloudSQL).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mysql-pvc
  namespace: prolance
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: Secret
metadata:
  name: mysql-secret
  namespace: prolance
type: Opaque
stringData:
  MYSQL_ROOT_PASSWORD: ""
  MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
  namespace: prolance
spec:
  replicas: 1
  selector: { matchLabels: { app: mysql } }
  strategy: { type: Recreate }
  template:
    metadata:
      labels: { app: mysql }
    spec:
      containers:
        - name: mysql
          image: mysql:8.0
          args: ["--default-authentication-plugin=mysql_native_password"]
          ports: [{ containerPort: 3306 }]
          envFrom: [{ secretRef: { name: mysql-secret } }]
          volumeMounts:
            - { name: data, mountPath: /var/lib/mysql }
          readinessProbe:
            tcpSocket: { port: 3306 }
            initialDelaySeconds: 20
            periodSeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: mysql-pvc }
---
apiVersion: v1
kind: Service
metadata:
  name: mysql
  namespace: prolance
spec:
  selector: { app: mysql }
  ports:
    - port: 3306
      targetPort: 3306
