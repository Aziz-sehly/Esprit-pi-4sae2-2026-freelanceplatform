# =====================================================================
#  Prolance · Prometheus alert rules
#  Loaded by Prometheus via `rule_files:` and routed to Alertmanager.
#
#  Severity convention :
#    - critical  → page immediately (Slack #alerts-critical + email)
#    - warning   → notify business hours (Slack #alerts-warning)
#    - info      → silenced by default; useful for dashboards
# =====================================================================
groups:

  # ---------------- Availability -------------------------------------
  - name: prolance.availability
    interval: 30s
    rules:

      - alert: ServiceDown
        expr: up{job=~"message-service|dispute-service|media-analysis-service"} == 0
        for: 1m
        labels:
          severity: critical
          team: backend
        annotations:
          summary: "Service {{ $labels.job }} is DOWN"
          description: "Prometheus has been unable to scrape {{ $labels.job }} on {{ $labels.instance }} for more than 1 minute."

      - alert: TooManyRestarts
        expr: increase(process_start_time_seconds{job=~"message-service|dispute-service|media-analysis-service"}[10m]) > 2
        for: 0m
        labels:
          severity: warning
          team: backend
        annotations:
          summary: "{{ $labels.job }} restarted >2× in 10 min"
          description: "{{ $labels.job }} on {{ $labels.instance }} restarted unusually often, look at the logs."

  # ---------------- HTTP / Traffic SLOs -----------------------------
  - name: prolance.http
    interval: 30s
    rules:

      - alert: HighHttpErrorRate
        expr: |
          (
            sum by (application) (rate(http_server_requests_seconds_count{status=~"5.."}[5m]))
            /
            clamp_min(sum by (application) (rate(http_server_requests_seconds_count[5m])), 0.001)
          ) > 0.05
        for: 5m
        labels:
          severity: critical
          team: backend
        annotations:
          summary: "{{ $labels.application }} 5xx rate > 5%"
          description: "More than 5% of HTTP requests on {{ $labels.application }} are failing (5xx) over the last 5 minutes."

      - alert: HighHttpLatencyP95
        expr: |
          histogram_quantile(0.95,
            sum by (le, application) (rate(http_server_requests_seconds_bucket[5m]))
          ) > 1
        for: 10m
        labels:
          severity: warning
          team: backend
        annotations:
          summary: "{{ $labels.application }} p95 latency > 1s"
          description: "p95 HTTP latency is above 1s for {{ $labels.application }} over the last 10 minutes."

  # ---------------- JVM ---------------------------------------------
  - name: prolance.jvm
    interval: 1m
    rules:

      - alert: JvmHeapPressure
        expr: |
          (
            sum by (application, instance) (jvm_memory_used_bytes{area="heap"})
            /
            sum by (application, instance) (jvm_memory_max_bytes{area="heap"})
          ) > 0.85
        for: 10m
        labels:
          severity: warning
          team: backend
        annotations:
          summary: "{{ $labels.application }} heap > 85%"
          description: "JVM heap usage on {{ $labels.application }}/{{ $labels.instance }} is above 85% for 10 minutes."

      - alert: JvmGcPaused
        expr: rate(jvm_gc_pause_seconds_sum[5m]) / clamp_min(rate(jvm_gc_pause_seconds_count[5m]), 0.001) > 0.5
        for: 10m
        labels:
          severity: warning
          team: backend
        annotations:
          summary: "{{ $labels.application }} GC pauses > 500ms"
          description: "Average GC pause on {{ $labels.application }} is above 500ms for 10 minutes."

  # ---------------- Containers / nodes (cAdvisor + node-exporter) ----
  - name: prolance.host
    interval: 1m
    rules:

      - alert: ContainerNearMemoryLimit
        expr: |
          container_memory_working_set_bytes{name!=""} /
          (container_spec_memory_limit_bytes{name!=""} > 0) > 0.9
        for: 5m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "Container {{ $labels.name }} memory > 90% of limit"
          description: "Container {{ $labels.name }} is consuming >90% of its memory limit for 5 minutes — risk of OOMKill."

      - alert: HostHighCPU
        expr: 1 - avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) > 0.85
        for: 10m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "Host {{ $labels.instance }} CPU > 85%"
          description: "Average CPU usage on {{ $labels.instance }} has been above 85% for 10 minutes."

      - alert: HostHighDisk
        expr: |
          (
            node_filesystem_size_bytes{fstype!~"tmpfs|overlay"} -
            node_filesystem_avail_bytes{fstype!~"tmpfs|overlay"}
          ) / node_filesystem_size_bytes{fstype!~"tmpfs|overlay"} > 0.85
        for: 10m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "Disk {{ $labels.mountpoint }} > 85%"
          description: "Filesystem {{ $labels.mountpoint }} on {{ $labels.instance }} is more than 85% full."
