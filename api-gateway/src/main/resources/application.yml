server:
  port: 8080
  error:
    include-message: always

spring:
  codec:
    max-in-memory-size: 10MB
  application:
    name: api-gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: false
      # Routes : voir GatewayRoutesConfig.java (RewritePath avec groupe nommé sans collision avec ${…} YAML)

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway

app:
  jwt:
    secret: ${APP_JWT_SECRET:change-this-super-secret-key-at-least-32-characters}
