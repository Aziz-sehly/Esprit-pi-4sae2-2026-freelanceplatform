apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-daxa
  namespace: prolance
  labels:
    app: frontend-daxa
    tier: frontend
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: frontend-daxa
  template:
    metadata:
      labels:
        app: frontend-daxa
        tier: frontend
    spec:
      containers:
        - name: frontend-daxa
          image: prolance/frontend-daxa:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 80
          resources:
            requests: { cpu: "50m",  memory: "64Mi" }
            limits:   { cpu: "300m", memory: "256Mi" }
          readinessProbe:
            httpGet: { path: /healthz, port: 80 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: 80 }
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-daxa
  namespace: prolance
  labels:
    app: frontend-daxa
spec:
  type: ClusterIP
  selector:
    app: frontend-daxa
  ports:
    - name: http
      port: 80
      targetPort: 80
