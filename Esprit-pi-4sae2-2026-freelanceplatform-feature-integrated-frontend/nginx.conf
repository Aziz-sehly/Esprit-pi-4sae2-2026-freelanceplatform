server {
    listen       80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # gzip
    gzip on;
    gzip_min_length  1024;
    gzip_proxied     any;
    gzip_types       text/plain text/css application/json application/javascript
                     application/xml application/xml+rss text/javascript image/svg+xml
                     application/wasm font/ttf application/font-woff2;

    # SPA routing : let Angular handle deep links
    location / {
        try_files $uri $uri/ /index.html;
    }

    # cache hashed assets for a year
    location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico|webp)$ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # liveness probe used by the Docker HEALTHCHECK + K8s
    location = /healthz {
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }

    # ---------- Reverse proxy to the API gateway ---------------------
    # In Kubernetes the API gateway is reachable via
    # http://api-gateway.prolance.svc.cluster.local:8765
    # Override with API_GATEWAY_URL at deploy-time if needed.
    set $api_gateway "http://api-gateway.prolance.svc.cluster.local:8765";

    location /microservice-user/ {
        proxy_pass $api_gateway;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass $api_gateway;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket endpoint of message-service
    location /ws/ {
        proxy_pass $api_gateway;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
    }

    location /project { proxy_pass $api_gateway; }
    location /proposal { proxy_pass $api_gateway; }

    # security headers
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options        SAMEORIGIN always;
    add_header Referrer-Policy        no-referrer-when-downgrade always;
}
