<div
    class="sidebar-area bg-white"
    [ngClass]="{'active': isSidebarToggled}"
    [class.component-dark-theme]="themeService.isDark()"
    [class.dark-sidebar]="themeService.isSidebarDark()"
    [class.right-sidebar]="themeService.isRightSidebar()"
    [class.hide-sidebar]="themeService.isHideSidebar()"
    [class.card-borderd-theme]="themeService.isCardBorder()"
    [class.rtl-enabled]="themeService.isRTLEnabled()"
>
    <div class="logo bg-white">
        <a routerLink="/back" class="d-flex align-items-center">
            <span class="fw-semibold">🚀 Prolance</span>
        </a>
    </div>
    <div
        (click)="toggle()"
        class="burger-menu"
        [ngClass]="{'active': isSidebarToggled}"
    >
        <span class="top-bar"></span>
        <span class="middle-bar"></span>
        <span class="bottom-bar"></span>
    </div>

    <ng-scrollbar visibility="hover">
        <div class="sidebar-inner">
            <div class="sidebar-menu">
                <mat-accordion>
                    <span class="sub-title text-body">
                        ADMIN PANEL
                    </span>

                    <a
                        routerLink="/back/admin-projects"
                        class="sidebar-menu-link"
                        routerLinkActive="active"
                        [routerLinkActiveOptions]="{exact: true}"
                    >
                        <i class="material-symbols-outlined">work</i>
                        <span class="title">Projects</span>
                    </a>

                    <a
                        routerLink="/back/admin-proposals"
                        class="sidebar-menu-link"
                        routerLinkActive="active"
                        [routerLinkActiveOptions]="{exact: true}"
                    >
                        <i class="material-symbols-outlined">description</i>
                        <span class="title">Proposals</span>
                    </a>

                    <a
                        routerLink="/back/admin-services"
                        class="sidebar-menu-link"
                        routerLinkActive="active"
                        [routerLinkActiveOptions]="{exact: true}"
                    >
                        <i class="material-symbols-outlined">storefront</i>
                        <span class="title">Services</span>
                    </a>

                    <a
                        routerLink="/back/admin-contracts"
                        class="sidebar-menu-link"
                        routerLinkActive="active"
                        [routerLinkActiveOptions]="{exact: true}"
                    >
                        <i class="material-symbols-outlined">contract</i>
                        <span class="title">Contracts</span>
                    </a>

                    <a
                        routerLink="/back/admin-disputes"
                        class="sidebar-menu-link"
                        routerLinkActive="active"
                        [routerLinkActiveOptions]="{exact: true}"
                    >
                        <i class="material-symbols-outlined">gavel</i>
                        <span class="title">Disputes</span>
                    </a>

                    <a
                        routerLink="/back/admin-messages"
                        class="sidebar-menu-link"
                        routerLinkActive="active"
                        [routerLinkActiveOptions]="{exact: true}"
                    >
                        <i class="material-symbols-outlined">chat</i>
                        <span class="title">Messages</span>
                    </a>

                    <a
                        routerLink="/back/admin-chat"
                        class="sidebar-menu-link"
                        routerLinkActive="active"
                        [routerLinkActiveOptions]="{exact: true}"
                    >
                        <i class="material-symbols-outlined">forum</i>
                        <span class="title">Chat</span>
                    </a>

                    <a
                        routerLink="/back/admin-users"
                        class="sidebar-menu-link"
                        routerLinkActive="active"
                        [routerLinkActiveOptions]="{exact: true}"
                    >
                        <i class="material-symbols-outlined">group</i>
                        <span class="title">Users</span>
                    </a>

                    <span class="sub-title text-body">
                        AUTH
                    </span>
                    <a routerLink="/authentication/logout" class="sidebar-menu-link" routerLinkActive="active">
                        <i class="material-symbols-outlined">logout</i>
                        <span class="title">Logout</span>
                    </a>
                </mat-accordion>
            </div>
        </div>
    </ng-scrollbar>
</div>
